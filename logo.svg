<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bioGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="url(#bioGrad)" stroke-width="6" opacity="0.4"/>

  <g transform="translate(0, 0)" filter="url(#glow)">
    <!-- DNA Strand 1 -->
    <path d="M140 100 Q256 180 372 100 Q256 260 140 340 Q256 420 372 340 Q256 500 140 420" 
          fill="none" stroke="url(#bioGrad)" stroke-width="18" stroke-linecap="round"/>
    
    <!-- DNA Strand 2 -->
    <path d="M372 100 Q256 180 140 100 Q256 260 372 340 Q256 420 140 340 Q256 500 372 420" 
          fill="none" stroke="url(#bioGrad)" stroke-width="18" stroke-linecap="round" opacity="0.85"/>

    <!-- Base Pair Rungs / Connection Nodes -->
    <!-- Rung 1 -->
    <line x1="175" y1="115" x2="337" y2="115" stroke="#38bdf8" stroke-width="8" stroke-dasharray="6 8" stroke-linecap="round"/>
    <circle cx="175" cy="115" r="11" fill="#10b981"/>
    <circle cx="337" cy="115" r="11" fill="#3b82f6"/>

    <!-- Central Node Cluster (Cross Section) -->
    <circle cx="256" cy="220" r="15" fill="#06b6d4"/>
    
    <!-- Rung 2 -->
    <line x1="150" y1="220" x2="362" y2="220" stroke="#38bdf8" stroke-width="8" stroke-dasharray="6 8" stroke-linecap="round"/>
    <circle cx="150" cy="220" r="11" fill="#3b82f6"/>
    <circle cx="362" cy="220" r="11" fill="#10b981"/>

    <!-- Rung 3 -->
    <line x1="175" y1="325" x2="337" y2="325" stroke="#38bdf8" stroke-width="8" stroke-dasharray="6 8" stroke-linecap="round"/>
    <circle cx="175" cy="325" r="11" fill="#10b981"/>
    <circle cx="337" cy="325" r="11" fill="#3b82f6"/>

    <!-- Rung 4 -->
    <line x1="200" y1="400" x2="312" y2="400" stroke="#38bdf8" stroke-width="8" stroke-dasharray="6 8" stroke-linecap="round"/>
    <circle cx="200" cy="400" r="10" fill="#38bdf8"/>
    <circle cx="312" cy="400" r="10" fill="#10b981"/>
  </g>
</svg>
